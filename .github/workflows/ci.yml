name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: uv installieren
        run: pip install uv

      - name: Abhängigkeiten installieren
        run: uv pip install -e ".[dev]" --system

      - name: Linting mit ruff
        run: ruff check src/ tests/ scripts/

      - name: Format check
        run: ruff format --check src/ tests/ scripts/

      - name: Syntax-Prüfung
        run: python -m py_compile src/wsl_envidat_mcp/server.py src/wsl_envidat_mcp/api_client.py

      - name: Import-Test
        run: python -c "from wsl_envidat_mcp.server import mcp; print('Import OK')"

      - name: Unit-Tests (offline, gemockt via respx)
        run: pytest -m "not live" -v
        env:
          PYTHONPATH: src
        timeout-minutes: 3

      - name: Versions-Sync (pyproject ↔ server.json / README / src)
        run: python scripts/check_version_sync.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: ruff check src/ tests/ scripts/
      - run: ruff format --check src/ tests/ scripts/

# Der frühere `live-tests`-Job stand hier. Er ist nach
# `.github/workflows/live.yml` gezogen, und zwar nicht als Umzug, sondern weil
# er zwei Dinge nicht konnte:
#
#   1. Er hatte keinen Zeitplan (`workflow_dispatch` oder Push auf `main`).
#      Ruht das Repo, faellt die Pruefung aus — und der Vertrag mit der Quelle
#      bricht gerade dann, wenn niemand etwas anfasst.
#   2. Er hatte kein Signal. Ein roter Lauf stand in der Actions-Liste und
#      sonst nirgends; gesehen haette ihn nur, wer ohnehin hinsieht.
#
# Ihn hier zusaetzlich stehen zu lassen waere schlechter als ihn zu loeschen:
# Zwei Live-Laeufe gegen dieselbe Quelle, von denen einer stumm rot wird,
# lassen offen, welcher gemeint ist, wenn jemand «die Live-Tests sind rot»
# sagt.
