name: Container image

on:
  # Auf Pull Requests wird GEBAUT, aber nicht gepusht. Ohne diesen Trigger
  # lief der Build erst nach dem Merge, und der Smoke-Test im Dockerfile
  # haette seine Aufgabe verfehlt: Er soll ein kaputtes Image aufhalten,
  # bevor es entsteht, nicht danach. Am 20.9.2026 ging genau deshalb ein
  # nicht lauffaehiges v0.3.0-Image in die Registry — der Dependabot-PR, der
  # das Basis-Image anhob, konnte das Dockerfile gar nicht bauen.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest auf main, semver auf Tags
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          # Nur ausserhalb von Pull Requests veroeffentlichen. Ein PR baut das
          # Image samt Smoke-Test und wirft es weg; in die Registry kommt nur,
          # was auf `main` oder einem Tag landet.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
