[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wsl-envidat-mcp"
version = "0.2.5"
description = "MCP-Server für WSL/EnviDat – Umweltforschungs- und Monitoringdaten der Eidg. Forschungsanstalt für Wald, Schnee und Landschaft"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Hayal Oezkan", email = "hayal.oezkan@zuerich.ch" }
]
keywords = ["mcp", "wsl", "envidat", "umweltdaten", "wald", "biodiversitaet", "naturgefahren", "schweiz", "opendata"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "mcp>=2.0.0,<3",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "structlog>=24.1.0,<27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    # Exakt gepinnt, nicht `>=`: ruff ist ein Gate, kein Hilfsmittel. Eine
    # neuere Version meldet Abweichungen an Code, den niemand angefasst hat.
    # Der Pin steht hier und nur hier — die CI installiert ihn ueber das
    # `dev`-Extra mit und hat keinen eigenen Pin-Schritt mehr. Beim Anheben:
    # Version aendern, `ruff format` einmal ueber die gelinteten Pfade laufen
    # lassen und das Ergebnis mit committen.
    "ruff==0.16.3",
]

[project.scripts]
wsl-envidat-mcp = "wsl_envidat_mcp.server:main"

[project.urls]
Homepage = "https://github.com/malkreide/wsl-envidat-mcp"
Repository = "https://github.com/malkreide/wsl-envidat-mcp"
Issues = "https://github.com/malkreide/wsl-envidat-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/wsl_envidat_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Diese Tests nehmen src/ zur Laufzeit in sys.path auf und muessen deshalb
# nach dieser Zeile importieren. E402 laesst sich hier nicht aufloesen, ohne
# den Import zu brechen.
"tests/test_20_szenarien.py" = ["E402"]
"tests/test_integration.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: erfordert Live-API-Zugriff auf envidat.ch",
]
